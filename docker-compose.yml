services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm123
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: crm
      DB_PASSWORD: crm123
      DB_NAME: crm
      DB_SSLMODE: disable
      JWT_SECRET: cambio-en-produccion
      GIN_MODE: release
      CORS_ORIGINS: "*"
      SEED_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
